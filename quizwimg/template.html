<!DOCTYPE html>
<html lang="__LANG__">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>__TITLE__</title>
<style>
  :root {
    --bg: #f4f6fa;
    --card: #ffffff;
    --primary: #0d3b66;
    --accent: #3a6ea5;
    --correct: #2a9d57;
    --wrong: #d94949;
    --muted: #6b7280;
    --border: #e2e6ee;
    --explain-bg: #f0f5fb;
  }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: #1a1f2e;
    margin: 0;
    padding: 0;
    line-height: 1.6;
  }
  .container { max-width: 820px; margin: 0 auto; padding: 24px 18px 80px; }
  header {
    text-align: center;
    padding: 26px 12px 18px;
    border-bottom: 2px solid var(--primary);
    margin-bottom: 22px;
  }
  header h1 { margin: 0 0 6px; color: var(--primary); font-size: 1.55rem; letter-spacing: -0.5px; }
  header .sub { color: var(--muted); font-size: 0.92rem; }

  .progress-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: var(--card);
    padding: 12px 16px;
    border-radius: 10px;
    margin-bottom: 16px;
    border: 1px solid var(--border);
    position: sticky;
    top: 8px;
    z-index: 5;
    box-shadow: 0 2px 6px rgba(0,0,0,0.04);
  }
  .progress-bar .label { font-weight: 600; color: var(--primary); }
  .progress-bar .score { color: var(--accent); font-weight: 600; }
  .progress-fill { flex: 1; height: 6px; background: #dde4ee; border-radius: 3px; margin: 0 14px; overflow: hidden; }
  .progress-fill > div { height: 100%; background: var(--primary); width: 0; transition: width 0.3s ease; }

  .section-filter {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    align-items: center;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 12px;
    margin: -4px 0 16px;
  }
  .section-filter .filter-label {
    font-size: 0.82rem;
    font-weight: 700;
    color: var(--muted);
    margin-right: 2px;
  }
  .section-filter button {
    background: #fff;
    color: var(--primary);
    border: 1.5px solid var(--border);
    border-radius: 999px;
    padding: 6px 11px;
    font-size: 0.82rem;
  }
  .section-filter button.active {
    background: var(--primary);
    border-color: var(--primary);
    color: #fff;
  }

  .question-card {
    background: var(--card);
    border-radius: 12px;
    padding: 22px 22px 18px;
    margin-bottom: 18px;
    border: 1px solid var(--border);
    box-shadow: 0 2px 10px rgba(13,59,102,0.05);
  }
  .q-num {
    display: inline-block;
    background: var(--primary); color: #fff; font-weight: 600;
    padding: 3px 12px; border-radius: 16px;
    font-size: 0.82rem; margin-bottom: 10px;
  }
  .q-vignette { font-size: 1.02rem; margin-bottom: 16px; line-height: 1.72; }
  .q-image-wrap { margin: 12px 0 16px; text-align: center; }
  .q-image {
    max-width: min(100%, 720px);
    max-height: 480px;
    height: auto;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: #fff;
    cursor: zoom-in;
  }
  .q-image-caption {
    font-size: 0.85rem;
    color: var(--muted);
    margin-top: 6px;
    line-height: 1.5;
  }
  /* Lightbox overlay for image zoom */
  .qimg-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.85);
    display: none; align-items: center; justify-content: center;
    z-index: 10000; cursor: zoom-out; padding: 24px;
  }
  .qimg-overlay.show { display: flex; }
  .qimg-overlay img { max-width: 100%; max-height: 100%; }
  .q-prompt { font-weight: 600; color: var(--primary); margin-top: 10px; }

  .choices { list-style: none; padding: 0; margin: 0; }
  .choice {
    display: flex;
    align-items: flex-start;
    padding: 11px 14px;
    margin: 6px 0;
    border: 1.5px solid var(--border);
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.15s;
    background: #fafcff;
  }
  .choice:hover:not(.disabled) { border-color: var(--accent); background: #eff4fb; }
  .choice.selected { border-color: var(--accent); background: #eaf1fa; }
  .choice.correct { border-color: var(--correct); background: #e8f7ed; }
  .choice.wrong { border-color: var(--wrong); background: #fce9e9; }
  .choice.disabled { cursor: default; }
  .choice-num {
    flex-shrink: 0; width: 26px; height: 26px;
    border-radius: 50%; background: #dde4ee; color: var(--primary);
    display: flex; align-items: center; justify-content: center;
    font-weight: 600; font-size: 0.85rem; margin-right: 12px;
  }
  .choice.correct .choice-num { background: var(--correct); color: #fff; }
  .choice.wrong .choice-num { background: var(--wrong); color: #fff; }
  .choice.selected .choice-num { background: var(--accent); color: #fff; }

  .actions { display: flex; gap: 10px; margin-top: 14px; flex-wrap: wrap; }
  button {
    background: var(--primary); color: #fff; border: none;
    border-radius: 8px; padding: 10px 20px;
    font-size: 0.95rem; font-weight: 600; cursor: pointer;
    transition: background 0.15s; font-family: inherit;
  }
  button:hover:not(:disabled) { background: var(--accent); }
  button:disabled { background: #b8c0cc; cursor: not-allowed; }
  button.secondary { background: #fff; color: var(--primary); border: 1.5px solid var(--primary); }
  button.secondary:hover:not(:disabled) { background: #f0f5fb; color: var(--primary); }

  .explanation {
    display: none;
    margin-top: 14px;
    padding: 14px 16px;
    background: var(--explain-bg);
    border-left: 4px solid var(--accent);
    border-radius: 6px;
    font-size: 0.94rem;
  }
  .explanation.visible { display: block; }
  .explanation .verdict { font-weight: 700; margin-bottom: 6px; font-size: 1rem; }
  .explanation .verdict.correct { color: var(--correct); }
  .explanation .verdict.wrong { color: var(--wrong); }
  .explanation .answer-line { margin: 6px 0; }
  .explanation .answer-line strong { color: var(--primary); }
  .explanation .rationale { margin-top: 8px; color: #2a3245; }
  .explanation .tag {
    display: inline-block;
    background: #e2eaf4; color: var(--primary);
    padding: 2px 10px; border-radius: 12px;
    font-size: 0.78rem; margin-right: 6px; margin-top: 8px;
  }

  .summary-card {
    background: var(--card);
    border-radius: 12px;
    padding: 26px;
    margin-top: 20px;
    border: 2px solid var(--primary);
    text-align: center;
    display: none;
  }
  .summary-card.visible { display: block; }
  .summary-card h2 { color: var(--primary); margin-top: 0; }
  .summary-card .final-score {
    font-size: 3rem; font-weight: 700;
    color: var(--primary); margin: 12px 0;
  }
  .summary-card .breakdown {
    text-align: left; margin: 14px 0; padding: 14px;
    background: var(--explain-bg); border-radius: 8px;
  }
  .summary-card .breakdown h4 { margin: 0 0 8px; color: var(--primary); }
  .summary-card .breakdown li { margin: 4px 0; }

  .q-nav {
    background: var(--card);
    border-radius: 12px;
    padding: 14px 16px;
    margin-top: 14px;
    border: 1px solid var(--border);
  }
  .q-nav .nav-label { font-size: 0.82rem; font-weight: 600; color: var(--muted); margin-bottom: 8px; }
  .nav-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(40px, 1fr)); gap: 6px; }
  .nav-cell {
    background: #eff2f7; color: var(--primary);
    border: 1.5px solid #dde4ee; border-radius: 6px;
    padding: 6px 0; font-size: 0.85rem; font-weight: 600;
    cursor: pointer; transition: all 0.12s;
  }
  .nav-cell:hover { border-color: var(--accent); }
  .nav-cell.current { border-color: var(--primary); border-width: 2px; background: #fff; }
  .nav-cell.marked { background: #eaf1fa; border-color: var(--accent); }
  .nav-cell.answered-correct { background: #e8f7ed; color: var(--correct); border-color: var(--correct); }
  .nav-cell.answered-wrong { background: #fce9e9; color: var(--wrong); border-color: var(--wrong); }
  .nav-cell.bookmarked::after { content: "🔖"; position: absolute; top: -6px; right: -4px; font-size: 0.62rem; }
  .nav-cell { position: relative; }

  /* Bookmark button on question card */
  .bookmark-btn {
    background: #fff !important; color: var(--muted) !important;
    border: 1.5px solid var(--border) !important;
    padding: 8px 14px !important;
    margin-left: auto;
    font-size: 0.9rem !important;
  }
  .bookmark-btn.active {
    background: #fff5e0 !important; color: #d97706 !important;
    border-color: #d97706 !important;
  }

  /* Summary: review lists */
  .review-section {
    text-align: left; margin: 14px 0; padding: 14px;
    background: var(--card); border: 1px solid var(--border);
    border-radius: 8px;
  }
  .review-section h4 { margin: 0 0 10px; color: var(--primary); font-size: 0.98rem; }
  .review-list { list-style: none; padding: 0; margin: 0; }
  .review-item {
    display: flex; align-items: flex-start; gap: 10px;
    padding: 8px 10px; margin: 4px 0;
    background: #fafcff; border: 1px solid var(--border);
    border-radius: 6px; cursor: pointer;
    transition: background 0.12s;
  }
  .review-item:hover { background: #eff4fb; }
  .review-item .review-q-num {
    flex-shrink: 0; min-width: 28px; height: 22px;
    background: var(--primary); color: #fff;
    border-radius: 4px; padding: 0 7px;
    font-weight: 700; font-size: 0.78rem;
    display: flex; align-items: center; justify-content: center;
  }
  .review-item .review-q-num.wrong { background: var(--wrong); }
  .review-item .review-q-num.unanswered { background: var(--muted); }
  .review-item .review-text {
    flex: 1; font-size: 0.86rem; color: #2a3245;
    overflow: hidden; text-overflow: ellipsis;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
  }
  .review-item .review-cat {
    font-size: 0.72rem; color: var(--muted);
    display: block; margin-top: 2px;
  }
  .retry-actions { display: flex; gap: 10px; margin-top: 14px; justify-content: center; flex-wrap: wrap; }

  footer { text-align: center; color: var(--muted); font-size: 0.82rem; margin-top: 30px; }

  @media (max-width: 600px) {
    header h1 { font-size: 1.25rem; }
    .q-vignette { font-size: 0.95rem; }
  }
</style>
</head>
<body>
<div id="qimgOverlay" class="qimg-overlay" onclick="closeZoom()"><img id="qimgOverlayImg" alt=""></div>
<div class="container">
  <header>
    <h1>__TITLE__</h1>
    <div class="sub">__SUBTITLE__</div>
  </header>

  <div class="progress-bar">
    <span class="label" id="progressLabel"></span>
    <div class="progress-fill"><div id="progressFill"></div></div>
    <span class="score" id="scoreLabel"></span>
    <button id="resultsBtn" onclick="showSummary()" style="margin-left:10px;padding:6px 12px;font-size:0.8rem;"></button>
  </div>

  <div class="section-filter" id="sectionFilter"></div>

  <div id="quizRoot"></div>

  <div class="summary-card" id="summary">
    <h2 id="summaryTitle"></h2>
    <div class="final-score" id="finalScore">0 / 0</div>
    <div id="summaryMsg"></div>
    <div class="breakdown" id="breakdown"></div>
    <div class="review-section" id="wrongSection" style="display:none;">
      <h4 id="wrongSectionTitle"></h4>
      <ul class="review-list" id="wrongList"></ul>
    </div>
    <div class="review-section" id="markedSection" style="display:none;">
      <h4 id="markedSectionTitle"></h4>
      <ul class="review-list" id="markedList"></ul>
    </div>
    <div class="retry-actions">
      <button id="retryWrongBtn" onclick="retryFiltered('wrong')" style="display:none;"></button>
      <button id="retryMarkedBtn" class="secondary" onclick="retryFiltered('marked')" style="display:none;"></button>
      <button id="retryAllBtn" class="secondary" onclick="resetAll()"></button>
    </div>
  </div>

  <footer>__FOOTER__</footer>
</div>

<script>
const QUESTIONS = __QUESTIONS_JSON__;
const STRINGS = __STRINGS_JSON__;

function escapeHTML(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// t(): plain string for textContent sinks.
// tEsc(): HTML-escaped string for innerHTML sinks — params must already be
// escaped (or be numbers); placeholders survive escaping since {} are safe.
function t(key, params) {
  let s = Object.prototype.hasOwnProperty.call(STRINGS, key) ? STRINGS[key] : key;
  if (params) for (const k in params) s = s.split('{' + k + '}').join(params[k]);
  return s;
}
function tEsc(key, params) {
  let s = escapeHTML(Object.prototype.hasOwnProperty.call(STRINGS, key) ? STRINGS[key] : key);
  if (params) for (const k in params) s = s.split('{' + k + '}').join(params[k]);
  return s;
}

// localStorage key per quiz title (bookmark persistence across reloads)
const QUIZ_KEY = 'quizwimg_marks_' + (document.title || 'untitled').replace(/\s+/g, '_');

function loadMarkedIds() {
  try {
    const raw = localStorage.getItem(QUIZ_KEY);
    return raw ? new Set(JSON.parse(raw)) : new Set();
  } catch { return new Set(); }
}

function saveMarkedIds(set) {
  try { localStorage.setItem(QUIZ_KEY, JSON.stringify([...set])); } catch {}
}

const markedIds = loadMarkedIds();

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// activeCategory: null = all questions; otherwise a category name or a retry label
let activeCategory = null;
let activeQuestions = QUESTIONS;
let shuffled = shuffle(activeQuestions);
let currentIdx = 0;
let qState = makeState(shuffled);

function getCategories() {
  return [...new Set(QUESTIONS.map(q => q.category).filter(Boolean))];
}

function makeState(items) {
  return items.map(q => ({
    selected: null, submitted: false, correct: false,
    marked: markedIds.has(q.id),
  }));
}

function renderSectionFilter() {
  const wrap = document.getElementById('sectionFilter');
  if (!wrap) return;
  const cats = getCategories();
  if (cats.length <= 1) {
    wrap.style.display = 'none';
    return;
  }
  wrap.style.display = 'flex';
  const allCls = activeCategory === null ? 'active' : '';
  let buttons = `<button class="${allCls}" onclick="applyCategoryFilter('')">${tEsc('all_label')} ${QUESTIONS.length}</button>`;
  buttons += cats.map(cat => {
    const cls = cat === activeCategory ? 'active' : '';
    const count = QUESTIONS.filter(q => q.category === cat).length;
    return `<button class="${cls}" onclick="applyCategoryFilter('${encodeURIComponent(cat)}')">${escapeHTML(cat)} ${count}</button>`;
  }).join('');
  wrap.innerHTML = `<span class="filter-label">${tEsc('sections_label')}</span>${buttons}`;
}

function startQuestionSet(items, label) {
  activeQuestions = items;
  activeCategory = label;
  shuffled = shuffle(activeQuestions);
  qState = makeState(shuffled);
  currentIdx = 0;
  document.getElementById('summary').classList.remove('visible');
  renderSectionFilter();
  renderCurrent();
  updateProgress();
}

function applyCategoryFilter(encodedCat) {
  if (!encodedCat) {
    startQuestionSet(QUESTIONS, null);
    return;
  }
  const cat = decodeURIComponent(encodedCat);
  startQuestionSet(QUESTIONS.filter(q => q.category === cat), cat);
}

function zoomImage(src) {
  const o = document.getElementById('qimgOverlay');
  const img = document.getElementById('qimgOverlayImg');
  if (!o || !img) return;
  img.src = src;
  o.classList.add('show');
}
function closeZoom() {
  const o = document.getElementById('qimgOverlay');
  if (o) o.classList.remove('show');
}
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeZoom();
});

function getCounts() {
  let answered = 0, correctCount = 0;
  qState.forEach(s => { if (s.submitted) { answered++; if (s.correct) correctCount++; } });
  return { answered, correctCount };
}

function imageBlock(src, caption, fallbackAltKey) {
  const captionHTML = caption
    ? `<div class="q-image-caption">${escapeHTML(caption)}</div>`
    : '';
  return `<div class="q-image-wrap">
    <img class="q-image" src="${src}" alt="${escapeHTML(caption || t(fallbackAltKey))}" onclick="zoomImage(this.src)">
    ${captionHTML}
  </div>`;
}

function renderCurrent() {
  const q = shuffled[currentIdx];
  const st = qState[currentIdx];
  const root = document.getElementById('quizRoot');

  const choicesHTML = q.choices.map((c, i) => {
    let cls = 'choice';
    if (st.submitted) {
      cls += ' disabled';
      if (i === q.correct) cls += ' correct';
      else if (i === st.selected && !st.correct) cls += ' wrong';
    } else if (st.selected === i) {
      cls += ' selected';
    }
    const clickHandler = st.submitted ? '' : `onclick="selectChoice(${i})"`;
    return `<li class="${cls}" data-idx="${i}" ${clickHandler}>
      <span class="choice-num">${i + 1}</span>
      <span class="choice-text">${escapeHTML(c)}</span>
    </li>`;
  }).join('');

  const isLast = currentIdx === shuffled.length - 1;
  const isFirst = currentIdx === 0;

  let expHTML = '';
  if (st.submitted) {
    const expImgHTML = q.explanation_image
      ? imageBlock(q.explanation_image, q.explanation_image_caption, 'image_alt')
      : '';
    expHTML = `
      <div class="explanation visible" id="expBox">
        <div class="verdict ${st.correct ? 'correct' : 'wrong'}">
          ${st.correct ? tEsc('verdict_correct') : tEsc('verdict_wrong')}
        </div>
        <div class="answer-line">
          <strong>${tEsc('answer_line', { num: q.correct + 1, text: escapeHTML(q.choices[q.correct]) })}</strong>
        </div>
        <div class="rationale">${escapeHTML(q.explanation)}</div>
        ${expImgHTML}
        <span class="tag">${escapeHTML(q.category)}</span>
      </div>`;
  } else {
    expHTML = `<div class="explanation" id="expBox"></div>`;
  }

  let actionsHTML = `<button class="secondary" id="prevBtn" onclick="goPrev()" ${isFirst ? 'disabled' : ''}>${tEsc('prev_btn')}</button>`;
  if (st.submitted) {
    if (isLast) {
      actionsHTML += `<button id="nextBtn" onclick="showSummary()">${tEsc('see_results_btn')}</button>`;
    } else {
      actionsHTML += `<button id="nextBtn" onclick="goNext()">${tEsc('next_btn')}</button>`;
    }
  } else {
    actionsHTML += `<button id="submitBtn" onclick="submitAnswer()" ${st.selected === null ? 'disabled' : ''}>${tEsc('submit_btn')}</button>`;
    if (!isLast) {
      actionsHTML += `<button class="secondary" id="skipBtn" onclick="goNext()">${tEsc('skip_btn')}</button>`;
    }
  }
  // Bookmark button — always visible
  const markActive = st.marked ? ' active' : '';
  const markLabel = st.marked ? tEsc('bookmarked_btn') : tEsc('bookmark_btn');
  actionsHTML += `<button class="bookmark-btn${markActive}" onclick="toggleMark()" title="${tEsc('bookmark_hint')}">${markLabel}</button>`;

  // Optional question figure (chart, diagram, photo, scan …)
  const imgHTML = q.image ? imageBlock(q.image, q.image_caption, 'image_alt') : '';
  const vignetteHTML = q.vignette
    ? `<div class="q-vignette">${escapeHTML(q.vignette)}</div>`
    : '';
  root.innerHTML = `
    <div class="question-card">
      <div class="q-num">Q${currentIdx + 1} / ${shuffled.length} · ${escapeHTML(q.category)}</div>
      ${vignetteHTML}
      ${imgHTML}
      <div class="q-prompt">${escapeHTML(q.prompt)}</div>
      <ul class="choices" id="choicesList">${choicesHTML}</ul>
      <div class="actions">${actionsHTML}</div>
      ${expHTML}
    </div>
    <div class="q-nav" id="qNav"></div>
  `;
  renderNavGrid();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function renderNavGrid() {
  const nav = document.getElementById('qNav');
  if (!nav) return;
  const cells = shuffled.map((q, i) => {
    const st = qState[i];
    let cls = 'nav-cell';
    if (i === currentIdx) cls += ' current';
    if (st.submitted) cls += st.correct ? ' answered-correct' : ' answered-wrong';
    else if (st.selected !== null) cls += ' marked';
    if (st.marked) cls += ' bookmarked';
    return `<button class="${cls}" onclick="goTo(${i})">${i + 1}</button>`;
  }).join('');
  nav.innerHTML = `<div class="nav-label">${tEsc('jump_label')}</div><div class="nav-grid">${cells}</div>`;
}

function toggleMark() {
  const q = shuffled[currentIdx];
  const st = qState[currentIdx];
  st.marked = !st.marked;
  if (st.marked) markedIds.add(q.id); else markedIds.delete(q.id);
  saveMarkedIds(markedIds);
  renderCurrent();
}

function selectChoice(idx) {
  const st = qState[currentIdx];
  if (st.submitted) return;
  st.selected = idx;
  document.querySelectorAll('#choicesList .choice').forEach((el, i) => {
    el.classList.toggle('selected', i === idx);
  });
  document.getElementById('submitBtn').disabled = false;
  renderNavGrid();
}

function submitAnswer() {
  const q = shuffled[currentIdx];
  const st = qState[currentIdx];
  if (st.submitted || st.selected === null) return;
  st.submitted = true;
  st.correct = st.selected === q.correct;
  renderCurrent();
  updateProgress();
}

function goNext() { if (currentIdx < shuffled.length - 1) { currentIdx++; renderCurrent(); } }
function goPrev() { if (currentIdx > 0) { currentIdx--; renderCurrent(); } }
function goTo(idx) { if (idx >= 0 && idx < shuffled.length) { currentIdx = idx; renderCurrent(); } }

function updateProgress() {
  const { answered, correctCount } = getCounts();
  document.getElementById('progressLabel').textContent = t('progress', { answered, total: shuffled.length });
  document.getElementById('scoreLabel').textContent = t('score', { score: correctCount });
  document.getElementById('progressFill').style.width = `${(answered / shuffled.length) * 100}%`;
}

function showSummary() {
  const { answered, correctCount } = getCounts();
  const total = shuffled.length;
  const pct = Math.round((correctCount / total) * 100);
  document.getElementById('finalScore').textContent = `${correctCount} / ${total}  (${pct}%)`;

  let msg = '';
  if (answered < total) msg = tEsc('msg_unanswered', { count: total - answered });
  else if (pct === 100) msg = tEsc('msg_perfect');
  else if (pct >= 85) msg = tEsc('msg_excellent');
  else if (pct >= 70) msg = tEsc('msg_good');
  else if (pct >= 50) msg = tEsc('msg_fair');
  else msg = tEsc('msg_review');
  document.getElementById('summaryMsg').innerHTML = `<p>${msg}</p>`;

  const cats = {};
  shuffled.forEach((q, i) => {
    if (!cats[q.category]) cats[q.category] = { total: 0, correct: 0, answered: 0 };
    cats[q.category].total++;
    if (qState[i].submitted) {
      cats[q.category].answered++;
      if (qState[i].correct) cats[q.category].correct++;
    }
  });
  let html = `<h4>${tEsc('breakdown_title')}</h4><ul style="list-style:none;padding:0;">`;
  Object.entries(cats).forEach(([cat, v]) => {
    const p = v.answered ? Math.round((v.correct / v.answered) * 100) : 0;
    const unansweredNote = v.answered < v.total
      ? ` ${tEsc('breakdown_unanswered', { count: v.total - v.answered })}`
      : '';
    html += `<li>• <strong>${escapeHTML(cat)}</strong>: ${v.correct}/${v.answered}${unansweredNote} ${v.answered ? `(${p}%)` : ''}</li>`;
  });
  html += '</ul>';
  document.getElementById('breakdown').innerHTML = html;

  // Wrong + unanswered list (click → jump back to that question)
  const wrongList = [];
  shuffled.forEach((q, i) => {
    const st = qState[i];
    if (st.submitted && !st.correct) {
      wrongList.push({ idx: i, q, type: 'wrong' });
    } else if (!st.submitted) {
      wrongList.push({ idx: i, q, type: 'unanswered' });
    }
  });
  const wrongSection = document.getElementById('wrongSection');
  if (wrongList.length > 0) {
    const items = wrongList.map(({ idx, q, type }) => {
      const numCls = type === 'wrong' ? 'wrong' : 'unanswered';
      const tag = type === 'wrong' ? tEsc('tag_wrong') : tEsc('tag_unanswered');
      return `<li class="review-item" onclick="jumpToQuestion(${idx})">
        <span class="review-q-num ${numCls}">${idx + 1}</span>
        <div class="review-text">${escapeHTML(q.prompt || (q.vignette || '').slice(0, 80))}
          <span class="review-cat">${tag} · ${escapeHTML(q.category)}</span>
        </div>
      </li>`;
    }).join('');
    document.getElementById('wrongList').innerHTML = items;
    wrongSection.style.display = 'block';
    document.getElementById('retryWrongBtn').style.display = wrongList.some(x => x.type === 'wrong') ? '' : 'none';
  } else {
    wrongSection.style.display = 'none';
    document.getElementById('retryWrongBtn').style.display = 'none';
  }

  // Bookmarked questions list
  const markedList = [];
  shuffled.forEach((q, i) => {
    if (qState[i].marked) markedList.push({ idx: i, q });
  });
  const markedSection = document.getElementById('markedSection');
  if (markedList.length > 0) {
    const items = markedList.map(({ idx, q }) => `
      <li class="review-item" onclick="jumpToQuestion(${idx})">
        <span class="review-q-num" style="background:#d97706;">${idx + 1}</span>
        <div class="review-text">${escapeHTML(q.prompt || (q.vignette || '').slice(0, 80))}
          <span class="review-cat">🔖 ${escapeHTML(q.category)}</span>
        </div>
      </li>`).join('');
    document.getElementById('markedList').innerHTML = items;
    markedSection.style.display = 'block';
    document.getElementById('retryMarkedBtn').style.display = '';
  } else {
    markedSection.style.display = 'none';
    document.getElementById('retryMarkedBtn').style.display = 'none';
  }

  document.getElementById('quizRoot').innerHTML = '';
  document.getElementById('summary').classList.add('visible');
  document.getElementById('summary').scrollIntoView({ behavior: 'smooth' });
}

function jumpToQuestion(idx) {
  // close the summary and return to that question
  document.getElementById('summary').classList.remove('visible');
  currentIdx = idx;
  renderCurrent();
}

function retryFiltered(mode) {
  // mode: 'wrong' | 'marked'
  const ids = new Set();
  if (mode === 'wrong') {
    shuffled.forEach((q, i) => {
      if (qState[i].submitted && !qState[i].correct) ids.add(q.id);
    });
  } else {
    shuffled.forEach((q, i) => {
      if (qState[i].marked) ids.add(q.id);
    });
  }
  if (ids.size === 0) return;
  const subset = QUESTIONS.filter(q => ids.has(q.id));
  startQuestionSet(subset, mode === 'wrong' ? t('retry_wrong_label') : t('retry_marked_label'));
}

function resetAll() {
  // retry everything (bookmarks persist, answers reset)
  startQuestionSet(QUESTIONS, null);
}

function applyStaticStrings() {
  document.getElementById('resultsBtn').textContent = t('results_btn');
  document.getElementById('summaryTitle').textContent = t('summary_title');
  document.getElementById('wrongSectionTitle').textContent = t('wrong_section_title');
  document.getElementById('markedSectionTitle').textContent = t('marked_section_title');
  document.getElementById('retryWrongBtn').textContent = t('retry_wrong_btn');
  document.getElementById('retryMarkedBtn').textContent = t('retry_marked_btn');
  document.getElementById('retryAllBtn').textContent = t('retry_all_btn');
}

applyStaticStrings();
renderSectionFilter();
renderCurrent();
updateProgress();
</script>
</body>
</html>
